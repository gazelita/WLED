name: Punto1
on:
  push:
    branches: [punto1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pio run -e punto1 2>&1 | tee build.log
        env:
          PHARE_BUILD: ${{ github.run_number }}
      - name: Diagnostic
        run: |
          echo "::notice::user_fx dans le log: $(grep -ci user_fx build.log)"
          echo "::notice::audioreactive dans le log: $(grep -ci audioreactive build.log)"
          echo "::notice::Musique bass dans le bin: $(grep -ac 'Musique bass' .pio/build/punto1/firmware.bin)"
          echo "::notice::Morse Code dans le bin: $(grep -ac 'Morse Code' .pio/build/punto1/firmware.bin)"
          echo "::notice::Spinning Wheel dans le bin: $(grep -ac 'Spinning Wheel' .pio/build/punto1/firmware.bin)"
          grep -E "error|Error" build.log | head -15 | while IFS= read -r l; do echo "::warning::$l"; done
          echo "::notice::Lignes usermods: $(grep -i 'usermod' build.log | head -5 | tr '\n' ' | ')"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-punto1
          path: .pio/build/punto1/firmware.bin
      - name: Publier pour la mise a jour automatique
        if: github.ref == 'refs/heads/punto1'
        run: |
          test -f .pio/build/punto1/firmware.bin
          mkdir pub && cp .pio/build/punto1/firmware.bin pub/ && echo ${{ github.run_number }} > pub/version.txt
          cd pub && git init -q && git checkout -q -b punto1-firmware && git add .
          git -c user.name=phare-ci -c user.email=ci@phare commit -qm "firmware #${{ github.run_number }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} punto1-firmware
